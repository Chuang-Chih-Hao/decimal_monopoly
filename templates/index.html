<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>小數大富翁</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
</head>
<body>
    <div id="login">
        <h2>加入小數大富翁</h2>
        <input type="text" id="playerName" placeholder="輸入你的名字">
        <input type="text" id="roomName" placeholder="輸入房號 (如: room1)">
        <button onclick="joinGame()">進入遊戲</button>
    </div>

    <div id="gameUI" style="display: none;">
        <div id="board">
            <!-- 棋盤格子由 JS 動態生成 -->
        </div>
        <div id="panel">
            <h3>玩家狀態</h3>
            <ul id="playerList"></ul>
            <button id="rollBtn" onclick="rollDice()">擲骰子 🎲</button>
        </div>
    </div>

    <!-- 答題彈窗 -->
    <div id="questionModal" style="display: none;">
        <h3 id="qText"></h3>
        <input type="number" step="0.1" id="qAnswer">
        <button onclick="submitAnswer()">送出答案</button>
    </div>

    <script src="/static/game.js"></script>
</body>
</html>
